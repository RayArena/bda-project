<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{% block metadescription %}Real-Time Twitter Sentiment Analysis dashboard{% endblock %}">
    <title>
        {% block title %}{% endblock title %}
    </title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.2/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/modern.css' %}">
    {% block links %}{% endblock links %}
</head>
<body>

    <nav class="navbar">
        <div class="wrap">
            <a href="{% url 'dashboard' %}" class="brand">
                <span class="logo-badge"><i class="fa-solid fa-chart-line"></i></span>
                <span>SentimentScope</span>
            </a>
            <div class="nav-links">
                <a href="{% url 'dashboard' %}" class="{% block nav_dashboard %}{% endblock %}">
                    <i class="fa-solid fa-gauge-high"></i> Dashboard
                </a>
                <a href="{% url 'classify' %}" class="{% block nav_classify %}{% endblock %}">
                    <i class="fa-solid fa-wand-magic-sparkles"></i> Classify
                </a>
            </div>
        </div>
    </nav>

    <main>
        {% block content %}{% endblock content %}
    </main>

    {% block scripts %}{% endblock scripts %}
</body>
</html>
